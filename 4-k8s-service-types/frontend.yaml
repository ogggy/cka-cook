#     - protocol: TCP
#       port: 80        # clusterIP service port 
#       targetPort: 80  # container port
#       nodePort: 30080 # if this blanks, NodePort range is typically 30000-32767
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-lb
spec:
  type: LoadBalancer
  selector:
    app: frontend
  ports:
    - protocol: TCP
      port: 80        # clusterIP service port 
      targetPort: 80  # container port
      nodePort: 31000 # if this blanks, NodePort range is typically 30000-32767