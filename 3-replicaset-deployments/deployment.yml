apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kubernetes.io/change-cause: "Initial deployment" 
  labels:
    app: nginx
  name: nginx-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
      environment: dev
      tier: frontend
  strategy: {}
  template:
    metadata:
      labels:
        app: nginx
        environment: dev
        tier: frontend
    spec:
      containers:
      - image: nginx
        name: nginx-container
        resources: {}
status: {}
