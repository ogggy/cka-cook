apiVersion: apps/v1
kind: Deployment
metadata:
  name: affinity-preferred

spec:
  replicas: 5

  selector:
    matchLabels:
      app: affinity-preferred

  template:
    metadata:
      labels:
        app: affinity-preferred

    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: zone
                operator: In
                values:
                - primary

      containers:
      - name: nginx
        image: nginx


        