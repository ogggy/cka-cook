apiVersion: v1
kind: Pod
metadata:
  name: my-nginx
  labels:
    app: nginx
spec:
  containers:
  - name: nginx
    image: nginx:1.14.2
    ports:
    - containerPort: 80
  - name: busybox
    image: busybox  
    command: ['sh', '-c', 'echo Hello Kubernetes! && sleep 3600']
    ports:
    - containerPort: 8080
